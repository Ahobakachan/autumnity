name: Build Autumnity

on:
  push:
    branches: ["ru-maple-integration"]
  workflow_dispatch:
  pull_request:
    branches: ["1.21.1"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: bash ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: autumnity-ru-maple-integration
          path: build/libs/*.jar
          if-no-files-found: error
